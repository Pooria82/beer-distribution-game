<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="crestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Shield Background -->
  <polygon points="32,4 58,18 58,46 32,60 6,46 6,18" fill="#0F172A" stroke="url(#crestGrad)" stroke-width="2.5"/>

  <!-- Beer Mug / Supply Chain Vector -->
  <!-- Mug Body -->
  <path d="M22 22 H42 V45 C42 48.3 39.3 51 36 51 H28 C24.7 51 22 48.3 22 45 Z" fill="url(#amberGrad)" opacity="0.9"/>
  <!-- Foam Top -->
  <rect x="20" y="16" width="24" height="7" rx="3.5" fill="#FFFFFF" filter="url(#glow)"/>
  <!-- Mug Handle -->
  <path d="M42 27 H46 C48.2 27 50 28.8 50 31 V39 C50 41.2 48.2 43 46 43 H42" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  <!-- Interior beer glass streaks -->
  <line x1="28" y1="26" x2="28" y2="44" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="36" y1="26" x2="36" y2="44" stroke="#FEF3C7" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
